\* 主張の検査: 不等式が成り立つ構成ではデッドロックしない。
\* 07 章と同じ上限・同じ SYMMETRY。違反は報告されないはず。
CONSTANTS
    BufCapacity = 3
    Producers = {p1, p2, p3, p4}
    Consumers = {c1, c2, c3}

SYMMETRY Symmetry

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT CapacityOK
INVARIANT DeadlockFreeIfInequation

\* デッドロックそのものは性質として扱うため、既定検査は切る。
CHECK_DEADLOCK FALSE
