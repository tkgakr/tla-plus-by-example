\* 不健全な SYMMETRY の実演用。NotSoleSecond は Producers の置換で値が
\* 変わる（対称でない）ため、この SYMMETRY 宣言のもとでは違反が見逃される。
\* BlockingQueueUnsoundNoSymmetry.cfg と比較すること。
CONSTANTS
    BufCapacity = 3
    Producers = {p1, p2, p3, p4}
    Consumers = {c1, c2, c3}

SYMMETRY Symmetry

INIT Init
NEXT Next

INVARIANT NotSoleSecond

CHECK_DEADLOCK FALSE
