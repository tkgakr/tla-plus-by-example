\* 不健全な VIEW の実演用。NotThreeDistinct は buffer の中身に依存するため、
\* 中身を捨てる View のもとで検査してはならない。違反は報告されない。
\* BlockingQueueUnsoundNoView.cfg と比較すること。
CONSTANTS
    BufCapacity = 3
    Producers = {p1, p2, p3, p4}
    Consumers = {c1, c2, c3}

VIEW View

INIT Init
NEXT Next

INVARIANT NotThreeDistinct

CHECK_DEADLOCK FALSE
