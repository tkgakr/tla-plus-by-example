\* 仕様で宣言した定数に、このモデル検査で使う値を割り当てる。
CONSTANT Size = 3
CONSTANT Procs = {p1, p2, p3}

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT SizeOK

\* p1、p2、p3 の名前の入れ替えを同一視して状態空間を縮約する。
SYMMETRY Perms

CHECK_DEADLOCK TRUE

\* 対称性縮約はライブネス違反を見落とす可能性があるため、この設定では
\* PROPERTY EventuallyAllActive を検査しない。通常の WorkerPool.cfg で検査する。
