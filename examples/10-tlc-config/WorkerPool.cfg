\* 仕様で宣言した定数に、このモデル検査で使う値を割り当てる。
CONSTANT Size = 3
CONSTANT Procs = {p1, p2, p3}

\* 初期状態述語と次状態関係を指定する。
INIT Init
NEXT Next

\* すべての到達可能状態で成立すべき条件を検査する。
INVARIANT TypeOK
INVARIANT SizeOK

\* すべての振る舞いで、いつか全作業者が稼働することを検査する。
PROPERTY EventuallyAllActive

\* 後続状態のない状態をエラーにする（既定値も TRUE）。
CHECK_DEADLOCK TRUE
